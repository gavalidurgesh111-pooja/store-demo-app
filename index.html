<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Modern Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="store">

  <!-- Large Cover Photo -->
  <section class="cover-wrapper">
    <img id="coverImage" alt="Store Cover Banner" />
    <div class="cover-overlay">
      <div class="cover-title" id="storeTitle">Store Name</div>
      <div class="cover-subtitle" id="storeSubtitle"></div>
    </div>
  </section>

  <!-- Store Sections (Rendered by app.js) -->
  <main class="container" id="sectionsContainer"></main>

  <!-- Order Modal -->
  <div class="modal-backdrop" id="orderModal">
    <div class="modal-card">
      <h3 id="modalItemTitle">Order Item</h3>
      <p id="modalItemPrice" class="modal-price-text"></p>
      <div class="field">
        <label>Customer Name</label>
        <input type="text" id="orderCustomer" placeholder="Enter your name" />
      </div>
      <div class="field">
        <label>Quantity</label>
        <input type="number" id="orderQty" value="1" min="1" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeOrderModal()">Cancel</button>
        <button type="button" class="btn-primary" onclick="confirmOrder()">Confirm Order</button>
      </div>
    </div>
  </div>

  <footer>
    <span>© Store Catalog</span>
    <span class="owner-trigger" onclick="openPinModal()">Manage</span>
  </footer>

  <script src="app.js"></script>
  <script src="owner-cover.js"></script>
  <script src="owner-edit.js"></script>
</body>
</html>
