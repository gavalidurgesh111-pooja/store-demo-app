<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Modern Store Demo</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 48px;
    }

    /* Large Cover Photo Area */
    .cover-wrapper {
      position: relative;
      width: 100%;
      height: 240px;
      background: #1e293b;
      overflow: hidden;
    }

    .cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.85;
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.15));
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 16px;
      color: #ffffff;
    }

    .cover-title {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .cover-subtitle {
      font-size: 0.9rem;
      color: #e2e8f0;
      margin-top: 4px;
    }

    /* Main Container */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 12px;
    }

    /* Each of the 15 Row Sections */
    .row-section {
      margin-bottom: 20px;
    }

    /* Wide Strip Bar (Patty) */
    .strip-bar {
      width: 100%;
      min-height: 44px;
      background: var(--surface);
      border-left: 5px solid var(--primary);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .strip-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .strip-tag {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Horizontal Scroll Container */
    .scroll-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-row::-webkit-scrollbar {
      height: 5px;
    }

    .scroll-row::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    /* Normal Size Rounded Box Card */
    .item-box {
      flex: 0 0 165px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .item-box img {
      width: 100%;
      height: 125px;
      object-fit: cover;
      background: #e5e7eb;
      display: block;
    }

    .item-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .item-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-price {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
    }

    .buy-btn {
      margin-top: auto;
      width: 100%;
      padding: 7px 10px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .buy-btn:active {
      background: var(--primary-dark);
    }

    /* Quick Order Modal / Bottom Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .modal-card h3 {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input, .field select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.92rem;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-secondary {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 10px;
      background: #e5e7eb;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    /* Subtle Footer with Hidden/Discrete Owner Access */
    footer {
      max-width: 1080px;
      margin: 24px auto 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .owner-trigger {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Owner Panel Overlay */
    .owner-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 16px auto;
      max-width: 1080px;
    }

    .owner-panel.active {
      display: block;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 12px 0 16px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .stat-num {
      font-size: 1.15rem;
      font-weight: 800;
      margin-top: 2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Large Cover Photo Section -->
  <section class="cover-wrapper">
    <img
      id="coverImage"
      src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80"
      alt="Store Cover Banner"
    />
    <div class="cover-overlay">
      <div class="cover-title" id="storeTitle">Urban Fresh Mart</div>
      <div class="cover-subtitle" id="storeSubtitle">Daily Essentials • Fast Delivery • Best Local Prices</div>
    </div>
  </section>

  <!-- 15 Strip Sections with Horizontal Scroll Boxes -->
  <main class="container" id="sectionsContainer"></main>

  <!-- Owner Dashboard (Hidden by default) -->
  <section class="owner-panel" id="ownerPanel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Owner Dashboard</h3>
      <button class="btn-secondary" style="flex:0 0 auto; padding:6px 12px;" onclick="closeOwnerPanel()">Close</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Items Sold</div>
        <div class="stat-num" id="statSold">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Sales</div>
        <div class="stat-num" id="statRevenue">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-num" id="statOrders">0</div>
      </div>
    </div>

    <h4 style="margin-bottom:8px;">Add Item to Section</h4>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
      <select id="newSectionIndex" style="flex:1 1 160px; padding:9px; border-radius:10px; border:1px solid #cbd5e1;"></select>
      <input id="newItemName" type="text" placeholder="Item Name" style="flex:1 1 150px; padding:9px; border-radius:10px; border:1px solid #cbd5e1;" />
      <input id="newItemPrice" type="number" placeholder="Price (₹)" style="flex:1 1 100px; padding:9px; border-radius:10px; border:1px solid #cbd5e1;" />
      <input id="newItemImg" type="text" placeholder="Photo URL (Optional)" style="flex:1 1 180px; padding:9px; border-radius:10px; border:1px solid #cbd5e1;" />
      <button class="btn-primary" style="flex:0 0 auto; padding:9px 14px;" onclick="addNewItem()">Add Item</button>
    </div>

    <h4>Recent Customer Orders</h4>
    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Item</th>
          <th>Qty</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="ordersTableBody"></tbody>
    </table>
  </section>

  <!-- Order Popup Modal -->
  <div class="modal-backdrop" id="orderModal">
    <div class="modal-card">
      <h3 id="modalItemTitle">Order Item</h3>
      <p id="modalItemPrice" style="color:var(--primary); font-weight:700; margin-bottom:10px;"></p>
      <div class="field">
        <label>Customer Name</label>
        <input type="text" id="orderCustomer" placeholder="Enter your name" />
      </div>
      <div class="field">
        <label>Quantity</label>
        <input type="number" id="orderQty" value="1" min="1" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeOrderModal()">Cancel</button>
        <button class="btn-primary" onclick="confirmOrder()">Confirm Order</button>
      </div>
    </div>
  </div>

  <!-- Discrete Owner Login Modal -->
  <div class="modal-backdrop" id="pinModal">
    <div class="modal-card">
      <h3>Owner Access</h3>
      <div class="field">
        <label>Enter Security PIN</label>
        <input type="password" id="ownerPinInput" placeholder="PIN (1234)" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closePinModal()">Cancel</button>
        <button class="btn-primary" onclick="verifyPin()">Unlock</button>
      </div>
    </div>
  </div>

  <footer>
    <span>© Store Catalog</span>
    <span class="owner-trigger" onclick="openPinModal()">Manage</span>
  </footer>

  <script>
    const OWNER_PIN = "1234";
    const FALLBACK_IMG = "https://images.unsplash.com/photo-1583258292688-d0213dc5a3a8?auto=format&fit=crop&w=500&q=70";

    const DEFAULT_SECTIONS = [
      "1. Trending Deals",
      "2. Fresh Fruits & Vegetables",
      "3. Dairy & Bakery",
      "4. Snacks & Namkeen",
      "5. Cold Drinks & Juices",
      "6. Atta, Rice & Dal",
      "7. Cooking Oil & Ghee",
      "8. Spices & Masala",
      "9. Tea, Coffee & Health Drinks",
      "10. Biscuits & Chocolates",
      "11. Personal Care",
      "12. Household & Cleaning",
      "13. Baby Care Essentials",
      "14. Dry Fruits & Nuts",
      "15. Combo Value Packs"
    ];

    function createInitialData() {
      const sections = DEFAULT_SECTIONS.map((title, idx) => {
        const items = [];
        for (let i = 1; i <= 6; i++) {
          items.push({
            id: `${idx}-${i}`,
            name: `Product ${idx + 1}.${i}`,
            price: (idx + 1) * 25 + i * 15,
            img: FALLBACK_IMG
          });
        }
        return { title, items };
      });
      return { sections, orders: [] };
    }

    let storeData = JSON.parse(localStorage.getItem("store15RowsDemo")) || createInitialData();
    let activeOrderItem = null;

    function saveData() {
      localStorage.setItem("store15RowsDemo", JSON.stringify(storeData));
    }

    function renderSections() {
      const container = document.getElementById("sectionsContainer");
      container.innerHTML = "";

      storeData.sections.forEach((sec, sIdx) => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "row-section";

        const stripEl = document.createElement("div");
        stripEl.className = "strip-bar";
        stripEl.innerHTML = `
          <span class="strip-title">${sec.title}</span>
          <span class="strip-tag">Swipe →</span>
        `;

        const scrollEl = document.createElement("div");
        scrollEl.className = "scroll-row";

        sec.items.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item-box";
          box.innerHTML = `
            <img src="${item.img || FALLBACK_IMG}" alt="${item.name}" onerror="this.src='${FALLBACK_IMG}'" />
            <div class="item-info">
              <div class="item-name" title="${item.name}">${item.name}</div>
              <div class="item-price">₹${item.price}</div>
              <button class="buy-btn" onclick="openOrderModal(${sIdx}, '${item.id}')">Order</button>
            </div>
          `;
          scrollEl.appendChild(box);
        });

        sectionEl.appendChild(stripEl);
        sectionEl.appendChild(scrollEl);
        container.appendChild(sectionEl);
      });
    }

    function openOrderModal(sectionIdx, itemId) {
      const sec = storeData.sections[sectionIdx];
      const item = sec.items.find((i) => i.id === itemId);
      if (!item) return;

      activeOrderItem = item;
      document.getElementById("modalItemTitle").textContent = item.name;
      document.getElementById("modalItemPrice").textContent = `Price: ₹${item.price}`;
      document.getElementById("orderCustomer").value = "";
      document.getElementById("orderQty").value = "1";
      document.getElementById("orderModal").classList.add("active");
    }

    function closeOrderModal() {
      document.getElementById("orderModal").classList.remove("active");
      activeOrderItem = null;
    }

    function confirmOrder() {
      if (!activeOrderItem) return;
      const customer = document.getElementById("orderCustomer").value.trim() || "Walk-in Customer";
      const qty = Math.max(1, parseInt(document.getElementById("orderQty").value, 10) || 1);
      const amount = activeOrderItem.price * qty;

      storeData.orders.push({
        customer,
        itemName: activeOrderItem.name,
        qty,
        amount
      });
      saveData();
      closeOrderModal();
      renderOwnerDashboard();
      alert(`Order Placed: ${activeOrderItem.name} x${qty} (₹${amount})`);
    }

    function openPinModal() {
      document.getElementById("ownerPinInput").value = "";
      document.getElementById("pinModal").classList.add("active");
    }

    function closePinModal() {
      document.getElementById("pinModal").classList.remove("active");
    }

    function verifyPin() {
      const pin = document.getElementById("ownerPinInput").value.trim();
      if (pin === OWNER_PIN) {
        closePinModal();
        const panel = document.getElementById("ownerPanel");
        panel.classList.add("active");
        renderOwnerDashboard();
        panel.scrollIntoView({ behavior: "smooth" });
      } else {
        alert("Incorrect PIN");
      }
    }

    function closeOwnerPanel() {
      document.getElementById("ownerPanel").classList.remove("active");
    }

    function renderOwnerDashboard() {
      const select = document.getElementById("newSectionIndex");
      select.innerHTML = "";
      storeData.sections.forEach((sec, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = sec.title;
        select.appendChild(opt);
      });

      const totalSold = storeData.orders.reduce((s, o) => s + o.qty, 0);
      const totalRev = storeData.orders.reduce((s, o) => s + o.amount, 0);

      document.getElementById("statSold").textContent = totalSold;
      document.getElementById("statRevenue").textContent = `₹${totalRev}`;
      document.getElementById("statOrders").textContent = storeData.orders.length;

      const tbody = document.getElementById("ordersTableBody");
      tbody.innerHTML = "";
      storeData.orders.slice().reverse().forEach((o) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${o.customer}</td>
          <td>${o.itemName}</td>
          <td>${o.qty}</td>
          <td>₹${o.amount}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addNewItem() {
      const sIdx = parseInt(document.getElementById("newSectionIndex").value, 10);
      const name = document.getElementById("newItemName").value.trim();
      const price = parseInt(document.getElementById("newItemPrice").value, 10);
      const img = document.getElementById("newItemImg").value.trim() || FALLBACK_IMG;

      if (!name || !price || price <= 0) {
        alert("Enter valid item name and price");
        return;
      }

      storeData.sections[sIdx].items.unshift({
        id: `${sIdx}-${Date.now()}`,
        name,
        price,
        img
      });
      saveData();
      renderSections();

      document.getElementById("newItemName").value = "";
      document.getElementById("newItemPrice").value = "";
      document.getElementById("newItemImg").value = "";
    }

    renderSections();
  </script>
</body>
</html>
