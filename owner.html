<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Owner Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="owner">

  <div class="top-bar">
    <a class="back-link" href="index.html">← Store</a>
    <button type="button" class="btn-secondary btn-compact" onclick="lockOwnerPage()">Lock</button>
  </div>

  <!-- Owner PIN Lock Modal -->
  <div class="modal-backdrop active" id="pinModal">
    <div class="modal-card modal-narrow">
      <h3>Owner Access</h3>
      <div class="field">
        <label>Enter Security PIN</label>
        <input type="password" id="ownerPinInput" placeholder="PIN (1234)" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="goToStoreFromPin()">Cancel</button>
        <button type="button" class="btn-primary" onclick="verifyPin()">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Main Owner Page -->
  <main class="owner-panel" id="ownerPanel">

    <!-- Top Two Boxes with Center '+' Sign Only -->
    <div class="owner-top-two-bars">
      <button type="button" class="owner-bar-btn bar-user" onclick="openOwnerStoreEditView()">
        <span class="bar-plus-center">+</span>
      </button>
      <button type="button" class="owner-bar-btn bar-expand" onclick="openExpandLimitsModal()">
        <span class="bar-plus-center">+</span>
      </button>
    </div>

    <!-- Owner Store View (Same User Store Layout + Inline Photo & Name Edit in Place) -->
    <section class="owner-box" id="ownerStoreEditView" style="display:none; margin-bottom:14px;">
      <div class="folder-view-header">
        <span class="sub-block-title" style="margin:0;">Store</span>
        <button type="button" class="icon-mini-btn danger-tone" title="Close" onclick="closeOwnerStoreEditView()">×</button>
      </div>

      <!-- Cover Banner in Same Position -->
      <div class="cover-wrapper" style="border-radius:14px; margin-bottom:14px;">
        <img id="ownerLiveCoverImg" src="" alt="" />
        <div class="cover-overlay">
          <div class="cover-title" id="ownerLiveCoverTitle"></div>
          <div class="cover-subtitle" id="ownerLiveCoverSubtitle"></div>
        </div>
      </div>

      <!-- Quick Cover Photo & Name Update Right in Place -->
      <div class="sub-block">
        <div class="form-grid">
          <input type="text" id="ownerLiveTitleInput" placeholder="Store Name" oninput="liveUpdateStoreHeader()" />
          <input type="text" id="ownerLiveSubtitleInput" placeholder="Subtitle" oninput="liveUpdateStoreHeader()" />
          <input type="file" id="ownerLiveCoverFile" accept="image/*" onchange="liveUpdateCoverPhoto(event)" />
          <button type="button" class="btn-primary" onclick="saveOwnerStoreChanges()">Update</button>
        </div>
      </div>

      <!-- Store Rows & Boxes in Same Position with Inline Photo & Name Edit -->
      <div id="ownerLiveStoreContainer"></div>
    </section>

    <!-- Clean Boxes Grid -->
    <div class="clean-boxes-grid" id="ownerFoldersGrid"></div>

  </main>

  <!-- Expand Limits Modal (Owner Max 50, Index Max 50, Cover Max 10) -->
  <div class="modal-backdrop z-70" id="expandLimitsModal">
    <div class="modal-card modal-wide">
      <h3>Limits</h3>
      <div class="field">
        <label>Owner Boxes (Max 50)</label>
        <input type="number" id="ownerBoxLimitInput" min="1" max="50" />
      </div>
      <div class="field">
        <label>Store Boxes (Max 50)</label>
        <input type="number" id="indexBoxLimitInput" min="0" max="50" />
      </div>
      <div class="field">
        <label>Cover Photos (Max 10 — Default 1)</label>
        <input type="number" id="coverSlotsLimitInput" min="1" max="10" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeExpandLimitsModal()">Cancel</button>
        <button type="button" class="btn-primary" onclick="saveExpandLimits()">Save</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Input for Inline Item Photo Change -->
  <input type="file" id="ownerInlineItemPhotoInput" accept="image/*" hidden onchange="applyOwnerInlineItemPhoto(event)" />

  <script src="app.js"></script>
</body>
</html>
