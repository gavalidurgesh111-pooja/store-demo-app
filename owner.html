<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Owner Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="owner">

  <div class="top-bar">
    <a class="back-link" href="index.html">← Store</a>
    <button type="button" class="btn-secondary btn-compact" onclick="lockOwnerPage()">Lock</button>
  </div>

  <!-- Owner PIN Lock Modal -->
  <div class="modal-backdrop active" id="pinModal">
    <div class="modal-card modal-narrow">
      <h3>Owner Access</h3>
      <div class="field">
        <label>Enter Security PIN</label>
        <input type="password" id="ownerPinInput" placeholder="PIN (1234)" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="goToStoreFromPin()">Cancel</button>
        <button type="button" class="btn-primary" onclick="verifyPin()">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Main Owner Workspace -->
  <main class="owner-panel" id="ownerPanel">
    <div class="panel-top-row">
      <h3>Owner Workspace</h3>
      <button type="button" class="btn-secondary btn-compact" onclick="lockOwnerPage()">Lock</button>
    </div>

    <!-- Folder Navigation Grid: 4 Core Folders + 10 Empty Editable Folders -->
    <div class="folder-grid" id="ownerFoldersGrid"></div>

    <!-- Active Folder Content Area -->
    <section class="owner-box" id="activeFolderView">
      <div class="folder-view-header">
        <h4 id="activeFolderHeading">Store Setup</h4>
        <button type="button" class="icon-mini-btn" title="Rename Folder" onclick="renameActiveFolder()">✎</button>
      </div>

      <!-- TAB 0: Store Setup -->
      <div id="tabStoreSetup" class="folder-tab-pane">
        <div class="sub-block">
          <div class="sub-block-title">Store Cover Photo & Name</div>
          <div class="cover-manage-row">
            <div id="ownerCoverThumb" class="cover-thumb-box" onclick="document.getElementById('editCoverFile').click()">
              <span class="plus-sign-icon">+</span>
            </div>
            <div class="cover-thumb-actions">
              <button type="button" class="icon-mini-btn plus-tone" title="Add / Change Cover" onclick="document.getElementById('editCoverFile').click()">+</button>
              <button type="button" class="icon-mini-btn danger-tone" title="Remove Cover" onclick="removeStoreCover()">×</button>
            </div>
            <input id="editCoverFile" type="file" accept="image/*" hidden onchange="previewAndSaveCover(event)" />
          </div>

          <div class="form-grid" style="margin-top:10px;">
            <input id="editStoreTitle" type="text" placeholder="Store Name" />
            <input id="editStoreSubtitle" type="text" placeholder="Store Tagline / Timing" />
            <button type="button" class="btn-primary" onclick="updateStoreHeader()">Save</button>
          </div>
        </div>

        <div class="sub-block">
          <div class="sub-block-title">Edit 15 Section Names</div>
          <div id="sectionNamesEditorList" class="editable-names-list"></div>
        </div>

        <div class="sub-block">
          <div class="sub-block-title">Add Item (Photo + Name + Price)</div>
          <div class="form-grid">
            <select id="newSectionIndex"></select>
            <input id="newItemName" type="text" placeholder="Item Name" />
            <input id="newItemPrice" type="number" placeholder="Price (₹)" min="1" />
            <input id="newItemFile" type="file" accept="image/*" />
            <button type="button" class="btn-primary" onclick="addNewItem()">+ Add Item</button>
          </div>
        </div>

        <div class="sub-block" style="margin-bottom:0;">
          <div class="sub-block-title">Manage Items (Edit Name, Price or Remove)</div>
          <div class="field">
            <select id="manageSectionFilter" onchange="renderOwnerItemsTable()"></select>
          </div>
          <div id="ownerItemsList" class="clean-row-list"></div>
        </div>
      </div>

      <!-- TAB 1: Active Users (Counter First to Save Cost, List on Tap) -->
      <div id="tabActiveUsers" class="folder-tab-pane" style="display:none;">
        <div class="cost-saver-stat" onclick="toggleUsersList()">
          <div>
            <div class="stat-label">Active Users</div>
            <div class="stat-num" id="activeUsersCount">0</div>
          </div>
          <button type="button" class="btn-primary btn-compact" id="toggleUsersBtn">View List</button>
        </div>

        <div id="activeUsersListWrap" style="display:none; margin-top:12px;">
          <div id="activeUsersList" class="clean-row-list"></div>
          <button type="button" class="btn-secondary" id="loadMoreUsersBtn" style="width:100%; margin-top:8px; display:none;" onclick="loadMoreUsers()">Load More</button>
        </div>
      </div>

      <!-- TAB 2: Sold Items (Photo + Name + Price + Total Sold Qty) -->
      <div id="tabSoldItems" class="folder-tab-pane" style="display:none;">
        <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
          <div class="stat-card">
            <div class="stat-label">Total Units Sold</div>
            <div class="stat-num" id="statSold">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Sales</div>
            <div class="stat-num" id="statRevenue">₹0</div>
          </div>
        </div>
        <div id="soldItemsList" class="clean-row-list"></div>
      </div>

      <!-- TAB 3: Buyers / Customer Orders (Photo + Name + Item Purchased) -->
      <div id="tabBuyers" class="folder-tab-pane" style="display:none;">
        <div class="stat-card" style="margin-bottom:10px;">
          <div class="stat-label">Total Orders</div>
          <div class="stat-num" id="statOrders">0</div>
        </div>
        <div id="buyersList" class="clean-row-list"></div>
      </div>

      <!-- TABS 4..13: 10 Custom Empty Editable Folders -->
      <div id="tabCustomFolder" class="folder-tab-pane" style="display:none;">
        <div class="phone-line-row" style="margin-bottom:10px;">
          <input type="text" id="customEntryInput" placeholder="Add note or item..." />
          <button type="button" class="icon-mini-btn plus-tone" title="Add" onclick="addCustomFolderEntry()">+</button>
        </div>
        <div id="customFolderEntriesList" class="clean-row-list"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
